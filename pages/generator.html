<!doctype html>
<html lang="fr">
    <head>
        <!-- ===============================
            META ESSENTIELS
        ================================ -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    
        <!-- ===============================
            SEO – SCOLY
        ================================ -->
        <title>Scoly | Générateur de certificats de scolarité en ligne</title>
    
        <meta
            name="description"
            content="Générez facilement un certificat de scolarité officiel avec Scoly. Une plateforme simple, rapide et fiable pour les élèves et établissements scolaires."
        />
    
        <meta
            name="keywords"
            content="certificat de scolarité, génération certificat, scoly, attestation scolaire, document scolaire officiel, plateforme scolaire"
        />
    
        <meta name="author" content="Scoly" />
    
        <!-- ===============================
            THEME COLOR (MOBILE)
        ================================ -->
        <meta name="theme-color" content="#3b5bdb" />
    
        <!-- ===============================
            STYLES
        ================================ -->
        <link rel="stylesheet" href="../css/03-generator/main.css" />
    
        <!-- ===============================
            GOOGLE FONTS
        ================================ -->
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
            rel="stylesheet"
        />
    
        <!-- ===============================
            FONT AWESOME
        ================================ -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            integrity="sha512-+d5o3qQlfB4Dl+d3TxhZ1+..."
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    
        <!-- ===============================
            FAVICON
        ================================ -->
        <link
            rel="icon"
            href="../assets/images/images/favicon.ico"
            type="image/x-icon"
        />
    </head>    
    <body>
        <div class="page-wrapper">
            <!-- ===============================
                HEADER – SCOLY
            ================================== -->
            <header class="main-header" role="banner">
                <div class="header-container">

                    <!-- LOGO -->
                    <div class="logo">
                        <a href="/" aria-label="Retour à l’accueil Scoly">
                           <img src="../assets/images/images/logo.png" class="logo-img" alt="LOGO SCOLY">
                        </a>
                    </div>

                    <!-- SWITCH THÈME -->
                    <div
                        class="theme-toggle"
                        role="switch"
                        aria-label="Changer le thème"
                        aria-checked="false"
                    >
                        <button
                            class="toggle-btn is-light"
                            aria-label="Activer le mode clair"
                        >
                            <i class="fa-solid fa-sun"></i>
                        </button>

                        <button
                            class="toggle-btn is-dark"
                            aria-label="Activer le mode sombre"
                        >
                            <i class="fa-solid fa-moon"></i>
                        </button>
                    </div>

                    <!-- MENU BURGER (MOBILE) -->
                    <button
                        class="menu-burger"
                        aria-label="Ouvrir le menu"
                        aria-expanded="false"
                        aria-controls="menu-overlay"
                    >
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>

                </div>
            </header>

            <!-- Menu Overlay -->
            <nav id="menu-overlay" class="menu-overlay" aria-hidden="true">
                <ul class="menu-links">
                    <li><a href="#">Accueil</a></li>
                    <li><a href="#">Avantages</a></li>
                    <li><a href="#">FAQ</a></li>
                </ul>
            </nav>

            <section class="form-section">

                <div class="form-container">
              
                  <!-- ===== Carte 1 ===== -->
                  <article class="form-card active" data-index="0">
                    <div class="progress-badge" data-progress="10">
                      <svg class="progress-circle" viewBox="0 0 36 36">
                        <path class="circle-bg"
                          d="M18 2.0845
                             a 15.9155 15.9155 0 0 1 0 31.831
                             a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle"
                          d="M18 2.0845
                             a 15.9155 15.9155 0 0 1 0 31.831
                             a 15.9155 15.9155 0 0 1 0 -31.831" />
                      </svg>
                      <span class="progress-text">10%</span>
                    </div>
              
                    <h2>Informations personnelles</h2>
              
                    <form class="form-fields">
                      <div class="form-group">
                        <label>Nom</label>
                        <div class="input-wrapper">
                          <input type="text" placeholder="Ex : ISAKA">
                        </div>
                      </div>
              
                      <div class="form-group">
                        <label>Prénom</label>
                        <div class="input-wrapper">
                          <input type="text" placeholder="Ex : Belmond">
                        </div>
                      </div>
                    </form>
                  </article>
              
                  <!-- ===== Carte 2 ===== -->
                  <article class="form-card" data-index="1">
                    <div class="progress-badge" data-progress="20">
                      <svg class="progress-circle" viewBox="0 0 36 36">
                        <path class="circle-bg"
                          d="M18 2.0845
                             a 15.9155 15.9155 0 0 1 0 31.831
                             a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle"
                          d="M18 2.0845
                             a 15.9155 15.9155 0 0 1 0 31.831
                             a 15.9155 15.9155 0 0 1 0 -31.831" />
                      </svg>
                      <span class="progress-text">20%</span>
                    </div>
              
                    <h2>Naissance</h2>
              
                    <form class="form-fields">
                      <div class="form-group">
                        <label>Date de naissance</label>
                        <div class="input-wrapper">
                          <input type="date">
                        </div>
                      </div>
              
                      <div class="form-group">
                        <label>Lieu de naissance</label>
                        <div class="input-wrapper">
                          <input type="text" placeholder="Ex : Cotonou">
                        </div>
                      </div>
                    </form>
                  </article>
              
                  <!-- ===== Navigation ===== -->
                  <button class="nav-arrow left-arrow">&#10094;</button>
                  <button class="nav-arrow right-arrow">&#10095;</button>
              
                </div>
            </section>
              
            <!-- ===============================
                FOOTER
            ================================== -->
            <footer class="main-footer" role="contentinfo">
                <p>&copy; 2025 Scoly. Tous droits réservés | Développé par l'équipe <strong>L&amp;DDYNAMICS</strong></p>
            </footer>
        </div>

        <!-- ===============================
            SCRIPTS
        ================================== -->
        <script src="../js/03-generator/progression.js"></script>
        <script src="../js/03-generator/cards-navigation.js"></script>
        <script src="../js/03-generator/overlay.js"></script>
    </body>
</html>
